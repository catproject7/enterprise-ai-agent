[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "enterprise-ai-agent"
version = "0.1.0"
description = "A production-oriented RAG and Agent platform for enterprise knowledge management."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [
  { name = "catproject7" },
]
dependencies = [
  "fastembed>=0.7,<1",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "qdrant-client>=1.15,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["enterprise_ai_agent"]
